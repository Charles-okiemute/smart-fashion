<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Smart Fashion: a digital fashion record system for small-scale tailors. Every measure. Every order. Linked.">
  <meta name="theme-color" content="#0b2a6f">
  <title>Smart Fashion | Every measure. Every order. Linked.</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">

  <!-- Fonts: Fraunces (headings) + Manrope (body). Cached by the service worker for offline use.
       If the fonts cannot load, the CSS falls back to Georgia / Segoe UI. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Inline SVG icon sprite (no icon library, no extra requests) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14c2.8.2 4.5 2.1 4.5 5"/></symbol>
    <symbol id="i-scissors" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.1 8.1L20 20M8.1 15.9L20 4"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h8M16 6h4M4 12h2M10 12h10M4 18h10M18 18h2"/><circle cx="14" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v4.5M12 18h.01"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 8V3h10v5"/><rect x="3" y="8" width="18" height="9" rx="2"/><rect x="7" y="14" width="10" height="7"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M4 21h16"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 8l5-5 5 5M4 21h16"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/></symbol>
    <symbol id="i-wifioff" viewBox="0 0 24 24"><path d="M2 8.8a15 15 0 0 1 4-2.3M22 8.8a15 15 0 0 0-9-3.7M5 12.9a10 10 0 0 1 3.5-2M19 12.9a10 10 0 0 0-5.2-2.7M8.5 16.4a5 5 0 0 1 7 0M12 20h.01M3 3l18 18"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-ruler" viewBox="0 0 24 24"><path d="M3 15L15 3l6 6L9 21z"/><path d="M7 11l2 2M10 8l2 2M13 5l2 2"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4z"/><path d="M4 7l11-3v3M16 14h2"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 .5 1.5 1.5 2 2 2 0-3-1-5 1-8z"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 4v6h6"/><path d="M20 12a8 8 0 1 0-2.6 5.9"/></symbol>
  </defs>
</svg>

<!-- ============ LOGIN (email + password, MFA, roles) ============ -->
<main id="login" class="login" hidden>
  <div class="login__wrap">
    <div class="login__brand">
      <svg class="brand__mark" viewBox="0 0 48 48" aria-hidden="true"><use href="#logo-mark"/></svg>
      <div class="brand__name">Smart <b>Fashion</b></div>
      <div class="login__tag">Every measure. Every order. Linked.</div>
    </div>
    <div class="card">
      <div class="ruler"></div>
      <div class="login__body" id="login-body"></div>
    </div>
    <p class="login__foot"><svg class="ic ic--sm"><use href="#i-shield"/></svg>Protected by multi-factor authentication, role-based access and encrypted connections.</p>
  </div>
</main>

<!-- Logo symbol: two chain links joined by a stitched thread -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eyeoff" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A9.8 9.8 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.5 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 4.2-.9M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
    <symbol id="i-userplus" viewBox="0 0 24 24"><circle cx="10" cy="8" r="3.5"/><path d="M3 20c0-3.6 3-6 7-6s7 2.4 7 6M19 8v6M16 11h6"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></symbol>
    <symbol id="logo-mark" viewBox="0 0 48 48">
    <rect x="3" y="12" width="26" height="20" rx="10" fill="none" stroke="#ffffff" stroke-width="4"/>
    <rect x="19" y="16" width="26" height="20" rx="10" fill="none" stroke="#a3bdff" stroke-width="4"/>
    <path d="M7 43h34" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="4 4"/>
  </symbol>
</svg>

<!-- ============ APP SHELL ============ -->
<div id="app" class="app" hidden>

  <!-- Desktop sidebar -->
  <aside class="sidebar" aria-label="Main">
    <a class="brand" href="#/dashboard">
      <svg class="brand__mark" viewBox="0 0 48 48" aria-hidden="true"><use href="#logo-mark"/></svg>
      <span class="brand__name">Smart <b>Fashion</b></span>
    </a>
    <nav id="nav-side"></nav>
    <div class="sidebar__foot">
      <span class="net-badge"><svg class="ic ic--sm"><use href="#i-wifioff"/></svg>Offline. Changes saved on this device</span>
      <span class="role-chip" data-role-chip></span>
      <button class="btn btn--ghost btn--sm" data-action="logout"><svg class="ic ic--sm"><use href="#i-logout"/></svg>Log out</button>
    </div>
  </aside>

  <div>
    <!-- Mobile top bar -->
    <header class="topbar">
      <div class="topbar__row">
        <a class="brand" href="#/dashboard">
          <svg class="brand__mark" viewBox="0 0 48 48" aria-hidden="true" style="width:32px;height:32px"><use href="#logo-mark"/></svg>
          <span class="brand__name">Smart <b>Fashion</b></span>
        </a>
        <div class="who">
          <span class="net-badge"><svg class="ic ic--sm"><use href="#i-wifioff"/></svg>Offline</span>
          <span class="role-chip" data-role-chip></span>
          <button class="icon-btn" data-action="logout" aria-label="Log out"><svg class="ic"><use href="#i-logout"/></svg></button>
        </div>
      </div>
      <div class="ruler ruler--light"></div>
    </header>

    <main class="main" id="view" tabindex="-1"></main>
  </div>

  <!-- Mobile bottom navigation -->
  <nav class="bottomnav" id="nav-bottom" aria-label="Main"><div class="ruler"></div></nav>
</div>

<div id="modal-root"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="print-area"></div>

<script src="js/db.js"></script>
<script src="js/config.js"></script>
<script src="js/mailer.js"></script>
<script src="js/auth.js"></script>
<script src="js/notify.js"></script>
<script src="js/app.js"></script>
</body>
</html>
